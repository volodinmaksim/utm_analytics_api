{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block body %}
<div class="flex min-h-screen items-center justify-center px-4 py-10">
  <div class="w-full max-w-md rounded-3xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/60">
    <div class="mb-6">
      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-slate-500">Analytics Admin</p>
      <h1 class="mt-2 text-3xl font-semibold text-slate-950">Вход в админку</h1>
      <p class="mt-2 text-sm text-slate-600">Доступ к управлению tracked sheets и ручному sync.</p>
    </div>

    {% if error %}
    <div class="mb-4 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/login" class="space-y-4">
      <label class="block">
        <span class="mb-2 block text-sm font-medium text-slate-700">Пароль администратора</span>
        <input type="password" name="password" required class="w-full rounded-2xl border border-slate-300 px-4 py-3 outline-none transition focus:border-slate-950 focus:ring-2 focus:ring-slate-200">
      </label>
      <button type="submit" class="w-full rounded-2xl bg-slate-950 px-4 py-3 text-sm font-semibold text-white transition hover:bg-slate-800">Войти</button>
    </form>
  </div>
</div>
{% endblock %}
